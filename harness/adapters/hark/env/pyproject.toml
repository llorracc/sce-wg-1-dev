# HARK's environment, defined and pinned by its adapter (../../../toolkits.yaml), locked in uv.lock and built as an image by the Dockerfile beside it. The pins of numpy, scipy and numba, and
# the interpreter in .python-version, are those the adapter's runs of 2026-11-01 recorded, so that the harness
# reproduces those results files. HARK is pinned at the adapter's commit (../README.md).
[project]
name = "sce-env-hark"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "econ-ark @ git+https://github.com/llorracc/HARK.git@1185280590b21fe2ddac80cadcfea66476e45380",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "numba==0.68.1",
  "sympy",
  "jsonschema",
  "pyyaml",
  "referencing",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
