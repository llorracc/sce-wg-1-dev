# dolo's environment for its adapter (../../toolkits.yaml), locked in uv.lock. dolo's release 0.4.9.20 needs Python
# below 3.12 and numpy below 2. The pins of numpy, scipy and numba, and the interpreter in .python-version, are those
# the adapter's runs of 2026-11-01 recorded, so that the harness reproduces those results files.
[project]
name = "sce-env-dolo"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
  "dolo==0.4.9.20",
  "numpy==1.26.4",
  "scipy==1.17.1",
  "numba==0.68.1",
  "jsonschema",
  "pyyaml",
  "referencing",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
