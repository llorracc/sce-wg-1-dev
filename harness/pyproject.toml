# The harness's own environment (README.md), locked in uv.lock: the runner, and the checker it calls to verify results.
[project]
name = "sce-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "jsonschema",
  "pyyaml",
  "referencing",
  "scipy",
  "numpy",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
