# HAFiscal's normal-times calibration, with the paper's estimated discount factors and the exact values of its published
# replication package (llorracc/HAFiscal-QE): lognormal laws, as the published code discretizes them, and permanent income
# frozen in unemployment, the world that reproduces the published numbers (model.md). Each group's seven betas are the
# equiprobable points of the uniform law on [beta - nabla, beta + nabla] around its estimate; the job-loss probabilities are
# u (1/D)/(1 - u), with the unemployment rate u and the spell's length D of each regime, the job-finding probability 2/3
# and the recession's exit hazard 1/6, each written as the double nearest its exact value. Newborn income is in thousands of
# dollars a quarter, by its median.
family: bst-markov_ui-and-agg/1
period: quarter
crra: 2.0
splurge: 0.24611389063967778
survival: 0.99375
return: 1.01
borrowing_constraint: 0.0
shocks:
  permanent_shock: {LogNormal: {sd_log: 0.05477225575051661}}
  employed_shock: {LogNormal: {sd_log: 0.34641016151377546}}
regimes:
  recession: {exit_hazard: 0.16666666666666666}
employment:
  benefit_quarters: 2
  job_finding: {normal: 0.6666666666666666, recession: 0.25}
  income_employed: 1.0
  income_with_benefits: 0.7
  income_without_benefits: 0.5
  unemployed_permanent_income: frozen
groups:
  - name: dropout
    share: 0.093
    growth: 1.0035525
    job_loss: {normal: 0.061930783242258654, recession: 0.05120481927710843}
    newborn_income: {median: 6.2, sd_log: 0.32}
    types:
