# HAFiscal's normal-times calibration as its published replication package (llorracc/HAFiscal-QE) solves it, so that the
# member reproduces the published numbers. The laws are the atoms the code solves on: it builds each shock with HARK's
# construct_lognormal_income_process_unemployment, 7 equiprobable atoms of the mean-one lognormal with log variance 0.003
# for psi and 0.12 for theta, and no unemployment atom, since unemployment is a Markov state; the values are those of
# HARK 0.14.1, under which the estimates of record were made, and the probabilities are its differences of CDF values,
# 1/7 to within an ulp. The atoms' floors are positive and the benefits are positive, so every state's natural limit is
# below zero, and the code's a >= 0 (BoroCnstArt = 0.0, one scalar) is an artificial constraint in every state.
# Permanent income is frozen in unemployment, the world that reproduces the published numbers (model.md). The discount
# factors and the splurge are the paper's estimates of record (Code/HA-Models/Results/attribution/
# DiscFacEstim_preOptionD.txt in HAFiscal-QE; the splurge 0.246 in Subfiles/Parameterization.tex): each group's seven
# betas are the equiprobable points of the uniform law on [beta - nabla, beta + nabla] around its estimate. The
# job-loss probabilities are u (1/D)/(1 - u), with the unemployment rate u and the spell's length D of each regime, the
# job-finding probability 2/3 and the recession's exit hazard 1/6, each written as the double nearest its exact value.
# Newborn income is in thousands of dollars a quarter, by its median. Two features of the published code's simulations
# are not stated here: agents die at 200 quarters (T_age = 200), which the solution does not depend on, and newborns
# start with assets of 1e-5, effectively zero.
