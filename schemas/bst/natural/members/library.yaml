# The community library's buffer-stock model (QuantEcon community-library pull request 5), in the natural scenario with a
# point mass: Buffer Stock Theory's own model. Its laws are truncated at three standard deviations, with the stated
# standard deviation kept after truncation, since the natural scenario needs strictly positive lower and finite upper
# bounds (the owner's decision of 2026-11-01). The zero-income event is the point mass, so the natural constraint is
# a > 0 and no agent ever reaches it.
family: bst-natural/1
period: year
crra: 2.0
types:
  - {beta: 0.96, share: 1.0}
survival: 1.0
return: 1.04
income:
  growth: 1.03
  permanent_shock: {TruncatedLogNormal: {sd_log: 0.1, bot: -3.0, top: 3.0}}
  unemployment: {prob: 0.005, income: 0.0}
  employed_shock: {TruncatedLogNormal: {sd_log: 0.1, bot: -3.0, top: 3.0}}
