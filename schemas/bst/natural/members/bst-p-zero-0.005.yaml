# Buffer Stock Theory's calibration (Carroll and Shanker, Theoretical Foundations of Buffer Stock Saving, table
# "Microeconomic Model Calibration", https://llorracc.github.io/BufferStockTheory/): annual, Gamma 1.03, R 1.04,
# beta 0.96, rho 2, sigma_psi 0.1 and sigma_theta 0.1, infinite lives, with the laws truncated at three standard
# deviations, the stated standard deviation kept after truncation, as the natural scenario needs.
# BST's own probability of zero income, 0.005: the same model as `library`, so the same hash, kept here as the
# ladder's first rung.
# One of three members that differ only in the probability of the zero-income event, for BST's experiment "The
# Liquidity Constrained Solution as a Limit": as the probability falls to zero, the consumption rule under the natural
# constraint, a > 0 here and never reached, converges to that of the restrained consumer, bst-restrained in
# bst-artificial/1, who has no zero-income event and a >= 0.
family: bst-natural/1
period: year
crra: 2.0
types:
  - {beta: 0.96, share: 1.0}
survival: 1.0
return: 1.04
income:
  growth: 1.03
  permanent_shock: {TruncatedLogNormal: {sd_log: 0.1, bot: -3.0, top: 3.0}}
  unemployment: {prob: 0.005, income: 0.0}
  employed_shock: {TruncatedLogNormal: {sd_log: 0.1, bot: -3.0, top: 3.0}}
