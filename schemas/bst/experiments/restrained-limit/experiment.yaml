# The restrained-limit experiment, to ../../../experiment.schema.json (../../../experiments.md). Draft, 2026-11-02.
experiment: restrained-limit/1
title: The liquidity-constrained solution as a limit
statement: >-
  As the probability of the zero-income event falls to zero, the consumption rule under the natural borrowing
  constraint converges to the rule of BST's restrained consumer, who has no zero-income event and may not borrow. The
  three natural members have BST's calibration with the probability 0.005, 0.0005 and 0.00005; the restrained member
  has the same calibration with the probability zero and a >= 0.
sources:
  bst: [the-liquidity-constrained-solution-as-a-limit]
members:
  - id: bst-p-zero-0.005
    parameter_file: ../../natural/members/bst-p-zero-0.005.yaml
    parameter_file_sha256: b2e365cd24b41d892e1ef40ca495c64a59de4fc1c718e2811b170dd9ae6732e4
    request_file: bst-p-zero-0.005.request.yaml
    request_file_sha256: c579f92bede050bd47200507ebdb3a7be7775a6ce7410ff1e45743982be50cb1
    note: BST's own probability; the same model as library
  - id: bst-p-zero-0.0005
    parameter_file: ../../natural/members/bst-p-zero-0.0005.yaml
    parameter_file_sha256: d642d4caef7385d4e8b23d4026edcc1237afbd12b0a86a410b1634b9e27bb773
    request_file: bst-p-zero-0.0005.request.yaml
    request_file_sha256: a841375573a657e65946fe29951e93febc70366c095699cbe81fc38e0085413a
  - id: bst-p-zero-0.00005
    parameter_file: ../../natural/members/bst-p-zero-0.00005.yaml
    parameter_file_sha256: d5a187ccc8cddd452ba3ebbbf3c1ff5233e019578b3362147b4c20734421b631
    request_file: bst-p-zero-0.00005.request.yaml
    request_file_sha256: f558978b2bdf8e8eca290ff3caa233a3044bfde3eae9c2770df87622c2d435f9
  - id: bst-restrained
    parameter_file: ../../artificial/members/bst-restrained.yaml
    parameter_file_sha256: 6e8651cdf2cd0baa14ca98ffc3940ba3586e0565e21d2a385f0ff1013e1c137c
    request_file: bst-restrained.request.yaml
    request_file_sha256: 04ec455e2b6a14d0cf1c8d2174ed6c6e96253896df7e9dfa064b8d18d33dfc36
    note: the limit, in bst-artificial/1
levels: [low, medium, high]
reports:
  - types[].rule.c
  - types[].rule.mpc
  - types[].kink
  - types[].population.mean_mpc
  - types[].population.mass_at_constraint
checks:
  - id: rungs_approach_the_limit
    statement: Each natural rule is closer to the restrained rule than the rung before it, at every level.
    compare: members
    quantity: types[].rule.c
    metric: max_abs_difference
    pairs:
      - [bst-p-zero-0.005, bst-restrained]
      - [bst-p-zero-0.0005, bst-restrained]
      - [bst-p-zero-0.00005, bst-restrained]
    expect: decreasing
  - id: same_effective_member
    statement: >-
      Two toolkits compared on a member solve the same effective member at the same level, so that a difference
      between their rules is their solutions' and not their discretizations'.
    compare: toolkits
    quantity: effective_member
    metric: max_relative_difference
    expect: {at_most: 1.0e-12}
  - id: toolkits_agree
    statement: >-
      The difference between two toolkits' rules shrinks at each finer level, as the error of each toolkit's solution of
      the same effective member does.
    compare: toolkits
    quantity: types[].rule.c
    metric: max_abs_difference
    expect: falls_with_level
report_scripts:
  - path: compare.py
    writes: one toolkit's tables of the gaps and the rules, and its figure
  - path: compare_toolkits.py
    writes: two toolkits' tables of their differences, and their figure
